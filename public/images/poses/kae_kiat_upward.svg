<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-upw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ruesi-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="16" fill="url(#bg-grad-upw)" stroke="#334155" stroke-width="2" />

  <!-- Traditional Thai Halo -->
  <circle cx="200" cy="205" r="160" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5" stroke-dasharray="4,6" />
  <circle cx="200" cy="205" r="130" fill="none" stroke="rgba(245, 158, 11, 0.12)" stroke-width="1.5" />
  <circle cx="200" cy="145" r="45" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1.2" />

  <!-- Title Badge -->
  <rect x="35" y="16" width="330" height="30" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" />
  <text x="200" y="36" fill="#38bdf8" font-size="12.5" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">ท่าแก้เกียจ — ดัดขึ้นเบื้องบน (เหนือศีรษะ 150°-180°)</text>

  <!-- Meditation Cushion / Platform -->
  <ellipse cx="200" cy="345" rx="130" ry="24" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <ellipse cx="200" cy="342" rx="115" ry="18" fill="rgba(245, 158, 11, 0.15)" stroke="#d97706" stroke-width="1" />

  <!-- Stylized Hermit Silhouette (Khad Samathi, Clasped Hands Overhead) -->
  <g id="figure-silhouette" opacity="0.95">
    <!-- Crossed Legs -->
    <path d="M140,265 C100,285 95,335 150,340 C190,345 200,310 200,310 Z" fill="#d97706" opacity="0.9" />
    <path d="M260,265 C300,285 305,335 250,340 C210,345 200,310 200,310 Z" fill="#d97706" opacity="0.9" />
    <path d="M120,315 Q200,345 280,315 Q200,325 120,315 Z" fill="#b45309" />

    <!-- Torso -->
    <path d="M172,168 Q168,220 180,275 L220,275 Q232,220 228,168 Z" fill="url(#ruesi-gold)" />
    <!-- Cloth Sash -->
    <path d="M174,170 Q192,220 218,275 L210,275 Q186,220 170,174 Z" fill="#b45309" opacity="0.9" />

    <!-- Head & Crown -->
    <path d="M195,150 L195,168 L205,168 L205,150 Z" fill="#f59e0b" />
    <ellipse cx="200" cy="146" rx="14" ry="17" fill="url(#ruesi-gold)" />
    <path d="M193,152 Q200,168 207,152 Q200,160 193,152 Z" fill="#92400e" />
    <path d="M192,132 Q200,102 208,132 Z" fill="#d97706" stroke="#fcd34d" stroke-width="1.5" />
    <ellipse cx="200" cy="132" rx="10" ry="3.5" fill="#b45309" />
    <circle cx="200" cy="102" r="3.5" fill="#fcd34d" />

    <!-- Arms Raised Overhead with Interlocked Fingers Pushing Upwards -->
    <!-- Left Arm -->
    <path d="M172,168 L184,72 L194,74 L182,168 Z" fill="url(#ruesi-gold)" />
    <!-- Right Arm -->
    <path d="M228,168 L216,72 L206,74 L218,168 Z" fill="url(#ruesi-gold)" />

    <!-- Clasped Palms Pushed Upward (ฝ่ามือหงายขึ้นฟ้า) -->
    <ellipse cx="200" cy="65" rx="22" ry="10" fill="#fcd34d" stroke="#b45309" stroke-width="1.5" />
    <path d="M188,65 Q200,60 212,65" fill="none" stroke="#92400e" stroke-width="1.5" />
  </g>

  <!-- MediaPipe Skeleton Vector Overlay -->
  <g filter="url(#neon-glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hips (23 -> 24) -->
    <line x1="180" y1="275" x2="220" y2="275" stroke="#10b981" stroke-width="3" />
    <!-- Spine -->
    <line x1="200" y1="170" x2="200" y2="275" stroke="#10b981" stroke-width="2.5" stroke-dasharray="2,3" opacity="0.6" />
    <!-- Left Hip to Shoulder (23 -> 11) -->
    <line x1="180" y1="275" x2="176" y2="170" stroke="#10b981" stroke-width="3.5" />
    <!-- Right Hip to Shoulder (24 -> 12) -->
    <line x1="220" y1="275" x2="224" y2="170" stroke="#10b981" stroke-width="3.5" />

    <!-- Left Upper Arm: 11 -> 13 (Upward) -->
    <line x1="176" y1="170" x2="182" y2="115" stroke="#38bdf8" stroke-width="4.5" />
    <!-- Left Forearm: 13 -> 15 (Upward to clasped hands) -->
    <line x1="182" y1="115" x2="192" y2="65" stroke="#38bdf8" stroke-width="4.5" />

    <!-- Right Upper Arm: 12 -> 14 -->
    <line x1="224" y1="170" x2="218" y2="115" stroke="#38bdf8" stroke-width="4.5" />
    <!-- Right Forearm: 14 -> 16 -->
    <line x1="218" y1="115" x2="208" y2="65" stroke="#38bdf8" stroke-width="4.5" />
  </g>

  <!-- Target Angle Badges -->
  <path d="M182,190 A25,25 0 0,0 178,135" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="2,2" />
  <rect x="80" y="112" width="76" height="22" rx="4" fill="#0f172a" stroke="#fcd34d" stroke-width="1.2" />
  <text x="118" y="127" fill="#fcd34d" font-size="10.5" font-family="monospace" font-weight="700" text-anchor="middle">เหยียด 170°</text>

  <path d="M218,190 A25,25 0 0,1 222,135" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="2,2" />
  <rect x="244" y="112" width="76" height="22" rx="4" fill="#0f172a" stroke="#fcd34d" stroke-width="1.2" />
  <text x="282" y="127" fill="#fcd34d" font-size="10.5" font-family="monospace" font-weight="700" text-anchor="middle">ยกชู 170°</text>

  <!-- Skyward Arrow -->
  <path d="M200,52 L200,42 M196,46 L200,42 L204,46" stroke="#34d399" stroke-width="2" fill="none" stroke-linecap="round" />

  <!-- Landmark Nodes -->
  <circle cx="176" cy="170" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="224" cy="170" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="182" cy="115" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="218" cy="115" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="192" cy="65" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="208" cy="65" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="180" cy="275" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1" />
  <circle cx="220" cy="275" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1" />

  <!-- Description Footer -->
  <rect x="30" y="368" width="340" height="22" rx="4" fill="rgba(15, 23, 42, 0.9)" />
  <text x="200" y="383" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif" text-anchor="middle">ประสานมือชูขึ้นเหนือศีรษะ แขนเหยียดตึงแนบชิดใบหู</text>
</svg>