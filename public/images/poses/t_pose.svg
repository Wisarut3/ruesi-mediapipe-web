<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-t" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="ruesi-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="16" fill="url(#bg-grad-t)" stroke="#334155" stroke-width="2" />

  <!-- Thai Traditional Ornamental Mandala / Halo -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="rgba(56, 189, 248, 0.08)" stroke-width="1.5" stroke-dasharray="4,6" />
  <circle cx="200" cy="200" r="130" fill="none" stroke="rgba(245, 158, 11, 0.12)" stroke-width="1.5" />
  <circle cx="200" cy="95" r="45" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" />

  <!-- Title Badge -->
  <rect x="50" y="16" width="300" height="30" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1" />
  <text x="200" y="36" fill="#38bdf8" font-size="13" font-family="-apple-system, sans-serif" font-weight="700" text-anchor="middle">🧪 ท่าทดสอบ — กางแขน (T-Pose)</text>

  <!-- Ground Plane -->
  <line x1="80" y1="365" x2="320" y2="365" stroke="#475569" stroke-width="2" stroke-linecap="round" />

  <!-- Stylized Hermit Silhouette (Standing T-Pose) -->
  <g id="figure-silhouette" opacity="0.95">
    <!-- Legs / Dhoti wrap -->
    <path d="M182,230 L175,355 L192,355 L196,255 L204,255 L208,355 L225,355 L218,230 Z" fill="#d97706" opacity="0.85" />
    <!-- Feet -->
    <ellipse cx="180" cy="358" rx="12" ry="5" fill="#b45309" />
    <ellipse cx="220" cy="358" rx="12" ry="5" fill="#b45309" />

    <!-- Torso / Belt -->
    <path d="M172,130 Q168,180 180,230 L220,230 Q232,180 228,130 Z" fill="url(#ruesi-gold)" />
    <!-- Ascetic Cloth Sash (สไบ/ผ้าพาดไหล่) -->
    <path d="M176,130 Q192,185 220,230 L212,230 Q188,185 172,135 Z" fill="#b45309" opacity="0.9" />

    <!-- Head & Hermit Crown (ชฎานักพรต) -->
    <!-- Head/Neck -->
    <path d="M194,115 L194,130 L206,130 L206,115 Z" fill="#f59e0b" />
    <ellipse cx="200" cy="100" rx="15" ry="18" fill="url(#ruesi-gold)" />
    <!-- Beard (เคราฤๅษี) -->
    <path d="M192,106 Q200,128 208,106 Q200,118 192,106 Z" fill="#92400e" />
    <!-- Ruesi Chada Topknot / Crown -->
    <path d="M190,86 Q200,50 210,86 Z" fill="#d97706" stroke="#fcd34d" stroke-width="1.5" />
    <ellipse cx="200" cy="86" rx="12" ry="4" fill="#b45309" />
    <circle cx="200" cy="50" r="4" fill="#fcd34d" />

    <!-- Horizontal Arms (T-Pose) -->
    <!-- Left Arm (Viewer's left) -->
    <path d="M175,135 L65,135 L65,147 L175,147 Z" fill="url(#ruesi-gold)" />
    <ellipse cx="62" cy="141" rx="8" ry="6" fill="#fcd34d" />
    <!-- Right Arm (Viewer's right) -->
    <path d="M225,135 L335,135 L335,147 L225,147 Z" fill="url(#ruesi-gold)" />
    <ellipse cx="338" cy="141" rx="8" ry="6" fill="#fcd34d" />
  </g>

  <!-- MediaPipe Landmark Connector Lines (Glowing Cyan) -->
  <g filter="url(#neon-glow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spine / Torso Frame -->
    <line x1="200" y1="138" x2="200" y2="230" stroke="#10b981" stroke-width="3" stroke-dasharray="2,3" opacity="0.7" />
    <!-- Torso Hip Vector (Left: 23, Right: 24) -->
    <line x1="185" y1="230" x2="215" y2="230" stroke="#10b981" stroke-width="3" />
    <!-- Left Hip to Shoulder (23 -> 11) -->
    <line x1="185" y1="230" x2="175" y2="140" stroke="#10b981" stroke-width="3.5" />
    <!-- Right Hip to Shoulder (24 -> 12) -->
    <line x1="215" y1="230" x2="225" y2="140" stroke="#10b981" stroke-width="3.5" />

    <!-- Target Angle Vector: Left Arm (11 -> 13 -> 15) -->
    <line x1="175" y1="140" x2="115" y2="140" stroke="#38bdf8" stroke-width="4.5" />
    <line x1="115" y1="140" x2="62" y2="140" stroke="#38bdf8" stroke-width="4.5" />

    <!-- Target Angle Vector: Right Arm (12 -> 14 -> 16) -->
    <line x1="225" y1="140" x2="285" y2="140" stroke="#38bdf8" stroke-width="4.5" />
    <line x1="285" y1="140" x2="338" y2="140" stroke="#38bdf8" stroke-width="4.5" />
  </g>

  <!-- Angle Indicator Arcs & Text (70°-110°, Target 90°) -->
  <!-- Left Side 90 deg Arc -->
  <path d="M175,170 A30,30 0 0,1 145,140" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="3,3" />
  <rect x="122" y="152" width="38" height="18" rx="4" fill="#0f172a" stroke="#fcd34d" stroke-width="1" />
  <text x="141" y="165" fill="#fcd34d" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">90°</text>

  <!-- Right Side 90 deg Arc -->
  <path d="M225,170 A30,30 0 0,0 255,140" fill="none" stroke="#fcd34d" stroke-width="2" stroke-dasharray="3,3" />
  <rect x="240" y="152" width="38" height="18" rx="4" fill="#0f172a" stroke="#fcd34d" stroke-width="1" />
  <text x="259" y="165" fill="#fcd34d" font-size="11" font-family="monospace" font-weight="700" text-anchor="middle">90°</text>

  <!-- Joint Landmark Nodes -->
  <!-- Shoulders (11, 12) -->
  <circle cx="175" cy="140" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="225" cy="140" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <!-- Elbows (13, 14) -->
  <circle cx="115" cy="140" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="285" cy="140" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
  <!-- Wrists (15, 16) -->
  <circle cx="62" cy="140" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <circle cx="338" cy="140" r="5" fill="#10b981" stroke="#ffffff" stroke-width="1.5" />
  <!-- Hips (23, 24) -->
  <circle cx="185" cy="230" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1" />
  <circle cx="215" cy="230" r="4.5" fill="#10b981" stroke="#ffffff" stroke-width="1" />

  <!-- Posture Target Description Footer -->
  <rect x="30" y="368" width="340" height="22" rx="4" fill="rgba(15, 23, 42, 0.9)" />
  <text x="200" y="383" fill="#cbd5e1" font-size="11" font-family="-apple-system, sans-serif" text-anchor="middle">กางแขน 90° ขนานพื้น — แขนเหยียดตรงทั้งสองข้าง</text>
</svg>